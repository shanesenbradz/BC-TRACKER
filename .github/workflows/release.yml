# Publishes a GitHub Release with the APK attached.
# Runs when BC-Tracker.apk or the release notes change on main (or by hand
# from the Actions tab). The version comes from android/version.properties,
# and a version that already has a release is skipped.
name: Release

on:
  push:
    branches: [main]
    paths:
      - BC-Tracker.apk
      - .github/release-notes.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -E "^versionName=" android/version.properties | cut -d= -f2)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Raise versionName in android/version.properties for a new one."
            exit 0
          fi
          gh release create "$TAG" BC-Tracker.apk \
            --target "$GITHUB_SHA" \
            --title "B.C Tracker $VERSION" \
            --notes-file .github/release-notes.md \
            --latest
